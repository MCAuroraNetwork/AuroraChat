plugins {
    id 'java'
    id 'io.github.goooler.shadow' version '8.1.8'
    id("io.papermc.paperweight.userdev") version '2.0.0-beta.14'
}

group = 'AuroraChat'
version = '1.1.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        url = 'https://repo.aikar.co/content/groups/aikar/'
    }
    maven {
        url = 'https://jitpack.io'
    }
    maven {
        url = 'https://repo.purpurmc.org/snapshots/'
    }
    maven {
        url = 'https://nexus.scarsz.me/content/groups/public/'
    }
}

dependencies {
    paperweight.devBundle("org.purpurmc.purpur", "1.21.4-R0.1-SNAPSHOT")

    implementation 'org.mongodb:mongodb-driver-sync:5.2.0'
    implementation 'co.aikar:acf-paper:0.5.1-SNAPSHOT'

    compileOnly("org.purpurmc.purpur:purpur-api:1.21.4-R0.1-SNAPSHOT")
    compileOnly 'com.discordsrv:discordsrv:1.26.0'
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        exclude group: 'org.bukkit', module: 'bukkit'
    }
    compileOnly 'me.clip:placeholderapi:2.11.6'
}

build {
    dependsOn(shadowJar)
}

shadowJar {
    minimize()
    archiveFileName.set("${project.name}-${project.version}.jar")
    relocate 'co.aikar.commands', 'club.aurorapvp.shaded.acf'
    relocate 'co.aikar.locales', 'club.aurorapvp.shaded.locales'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
